<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9ddce">
  <meta name="description" content="Conéctate con Siluets Spa Europeo y comparte tu experiencia.">
  <title>¡Gracias por tu visita! | Siluets Spa Europeo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <main class="card">
    <div class="brand-mark">
      <img class="logo" src="logo.png" alt="Logotipo de Siluets Spa Europeo">
    </div>

    <h1>¡Gracias por tu visita!</h1>
    <p class="subtitulo">Tu opinión nos ayuda a seguir mejorando. Cuéntanos cómo fue tu experiencia en esta sucursal.</p>

    <a class="btn-principal" target="_blank" rel="noopener noreferrer"
       href="https://search.google.com/local/writereview?placeid=ChIJy2XNVfzVz4URZM50VJ09_-w">
      <span class="icono-principal"><i class="fa-brands fa-google"></i></span>
      <span class="texto">
        <strong>Déjanos una reseña en Google</strong>
        <small>Comparte tu experiencia</small>
      </span>
      <span class="flecha" aria-hidden="true">↗</span>
    </a>

    <p class="seccion">Síguenos y conéctate</p>
    <nav class="links" aria-label="Redes sociales y contacto">
      <a class="link" id="facebook-link" href="https://www.facebook.com/profile.php?id=61591331412907" target="_blank" rel="noopener noreferrer">
        <span class="icono"><i class="fa-brands fa-facebook-f"></i></span>
        <span class="nombre">Facebook</span>
        <span class="flecha" aria-hidden="true">↗</span>
      </a>

      <a class="link" id="instagram-link" href="https://www.instagram.com/siluetsprodiet.sanma?evlk=OTB3cWowZ2RnNm1p" target="_blank" rel="noopener noreferrer">
        <span class="icono"><i class="fa-brands fa-instagram"></i></span>
        <span class="nombre">Instagram</span>
        <span class="flecha" aria-hidden="true">↗</span>
      </a>

      <a class="link" id="whatsapp-link" href="https://wa.me/522481057597" target="_blank" rel="noopener noreferrer">
        <span class="icono"><i class="fa-brands fa-whatsapp"></i></span>
        <span class="nombre">WhatsApp</span>
        <span class="flecha" aria-hidden="true">↗</span>
      </a>
    </nav>
    <p class="pie">S I L U E T S &nbsp; S P A &nbsp; E U R O P E O</p>
  </main>
</body>
</html>
